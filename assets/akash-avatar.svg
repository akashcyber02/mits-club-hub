<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="neonRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle with Neon Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="url(#neonRing)" stroke-width="6" filter="url(#glow)"/>
  
  <!-- Cyber Tech Rings / Grid Lines -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="rgba(129, 140, 248, 0.25)" stroke-width="1.5"/>

  <!-- Developer Silhouette / Character Body -->
  <path d="M 100 370 C 105 285 140 260 200 260 C 260 260 295 285 300 370 Z" fill="url(#hoodieGrad)"/>
  <path d="M 155 260 L 200 310 L 245 260 Z" fill="#1e40af"/>

  <!-- Neck -->
  <rect x="180" y="220" width="40" height="48" rx="8" fill="#d97706"/>

  <!-- Head / Face -->
  <rect x="145" y="125" width="110" height="120" rx="45" fill="url(#skinGrad)"/>

  <!-- Hair / Modern Style -->
  <path d="M 135 150 C 135 95 160 70 200 70 C 240 70 265 95 265 150 C 255 125 240 110 200 110 C 160 110 145 125 135 150 Z" fill="#0f172a"/>
  
  <!-- Smart Glasses with Neon Reflection -->
  <rect x="150" y="150" width="42" height="28" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="208" y="150" width="42" height="28" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="192" y1="162" x2="208" y2="162" stroke="#38bdf8" stroke-width="3"/>
  <!-- Glare in glasses -->
  <line x1="154" y1="154" x2="168" y2="174" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="212" y1="154" x2="226" y2="174" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Smile / Expression -->
  <path d="M 185 210 Q 200 222 215 210" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>

  <!-- AI Brain / Tech Sparks -->
  <g fill="#38bdf8" opacity="0.85">
    <circle cx="95" cy="140" r="4"/>
    <circle cx="75" cy="180" r="3"/>
    <circle cx="310" cy="145" r="4"/>
    <circle cx="325" cy="190" r="3"/>
    <line x1="95" y1="140" x2="75" y2="180" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
    <line x1="310" y1="145" x2="325" y2="190" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Developer Badge Emblem at Bottom Center -->
  <g transform="translate(130, 320)">
    <rect x="0" y="0" width="140" height="36" rx="18" fill="#090d16" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <text x="70" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">AKASH DHAKAD</text>
  </g>
</svg>